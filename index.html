<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>动句 · 描述即动作短视频</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grain"></div>
  </div>

  <main class="stage-shell">
    <header class="brand-block">
      <p class="brand">动句</p>
      <h1>用一句话，做出人物动作短视频</h1>
      <p class="lede">写下动作描述，角色会按顺序表演，并可导出短片。</p>
    </header>

    <section class="composer" aria-label="描述与生成">
      <label class="sr-only" for="prompt">动作描述</label>
      <textarea
        id="prompt"
        rows="2"
        maxlength="120"
        placeholder="例如：一个小朋友挥手打招呼，然后开心地跳跃，再跑两步"
      ></textarea>
      <div class="composer-row">
        <div class="examples" aria-label="示例描述">
          <button type="button" class="example" data-prompt="挥手打招呼，然后鞠躬致意">挥手 → 鞠躬</button>
          <button type="button" class="example" data-prompt="跑步冲刺，再跳跃庆祝，最后鼓掌">跑跳鼓掌</button>
          <button type="button" class="example" data-prompt="坐下休息，站起来点头，再跳舞">坐站跳舞</button>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="playBtn">预览</button>
          <button type="button" class="btn btn-primary" id="exportBtn">导出短视频</button>
        </div>
      </div>
      <p class="parse-line" id="parseLine" aria-live="polite">等待描述…</p>
    </section>

    <section class="viewport" aria-label="角色舞台">
      <canvas id="stage" width="960" height="540" role="img" aria-label="人物动作舞台"></canvas>
      <div class="viewport-meta">
        <span id="statusText">准备就绪</span>
        <span id="timerText">0.0s</span>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <p>支持：挥手 · 走路 · 跑步 · 跳跃 · 跳舞 · 鼓掌 · 鞠躬 · 坐下 · 点头 · 庆祝</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
